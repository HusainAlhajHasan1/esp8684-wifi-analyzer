; ============================================================================
;  ESP8684 (ESP32-C2) Wi-Fi Network Analyzer — Phase 1 firmware
;  Target: ESP8684-DevKitM-1  (ESP8684-WROOM-02C module, USB-to-UART bridge)
;  Toolchain: PlatformIO + ESP-IDF
; ============================================================================
;
;  NOTE ON FLASH SIZE
;  ------------------
;  MEASURED on the target board: 4 MB (ESP8684H, GigaDevice flash).
;  Declaring MORE flash than physically present causes boot loops, so this was
;  previously defaulted to a safe 2 MB until `esptool flash-id` settled it.
;
;  NOTE ON USB-UART BRIDGE
;  ----------------------
;  The genuine board uses CP2102N. Boards reporting a CH340/CH343 (VID 1A86)
;  are clones or re-bridged units. Firmware is identical either way; only the
;  host-side USB VID/PID filtering differs (see android/ + tools/host/).
; ============================================================================

[env:esp8684-devkitm1]
; ---------------------------------------------------------------------------
; WHY pioarduino AND NOT stock espressif32
; ---------------------------------------------------------------------------
; Stock platformio/espressif32 cannot build for ESP32-C2 at all:
;   * it ships no ESP32-C2 board definition, and
;   * builder/frameworks/espidf.py selects the RISC-V toolchain only when
;     `mcu in ("esp32c3","esp32c6")`, so mcu=esp32c2 silently gets the Xtensa
;     toolchain and the build dies with "riscv32-esp-elf-gcc ... not found".
; pioarduino (community fork of the same platform) adds C2 boards, the correct
; RISC-V toolchain selection and a C2 compile skeleton. Pinned to an exact
; release: do not float it without re-running the Phase 1 test suite.
; ---------------------------------------------------------------------------
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
; Our own manifest (4 MB flash, dio, 278528 B RAM) rather than the fork's default.
board     = esp8684_devkitm1
framework = espidf

; --- Flash / boot -----------------------------------------------------------
; CONFIRMED 4 MB on the target board (esptool flash-id, 2026-11-12):
;   Chip type: ESP8684H (revision v2.0), Embedded Flash 4MB (GD), MAC b8:7b:4d:c8:aa:0c
; The earlier 2 MB default was a safety assumption for a possible clone; it is
; now settled by measurement, so the app partition gets the full 3.9 MB.
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv

; --- Serial -----------------------------------------------------------------
monitor_speed   = 115200
monitor_filters = direct
monitor_rts     = 0
monitor_dtr     = 0

; --- Build ------------------------------------------------------------------
build_flags =
    -DFW_VERSION=\"0.2.1\"
    -DFW_BUILD_TAG=\"phase1\"
    -DPROTO_VERSION=1
    -Wall
    -Wextra
    -Wno-unused-parameter

build_unflags = -std=gnu++11

; Upload: CH34x bridges on clone boards are flaky above 460800.
upload_speed = 460800

; --- Extra script: concise size report --------------------------------------
extra_scripts = post:scripts/size_report.py

; ===========================================================================
;  DIAGNOSTIC BUILD — only used to answer "the board is silent, why?"
;  Same firmware plus esp_rom_printf breadcrumbs and the normal IDF console
;  log left enabled (no JSON log router), so the boot log is human-readable.
;  Never ship this as the release image.
; ===========================================================================
[env:esp8684-diag]
extends = env:esp8684-devkitm1
build_flags =
    ${env:esp8684-devkitm1.build_flags}
    -DWFA_DIAG_BUILD=1
