# This project must build on modest hardware: a 2 GB CI box, or a phone-adjacent
# laptop. An earlier configuration (-Xmx2048m, parallel, separate Kotlin daemon)
# was OOM-killed on a 1.9 GB machine during dexing.
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=224m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx448m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
